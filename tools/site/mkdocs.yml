# MkDocs config for the lab manual site.
# Paths are relative to this file. Run via tools/site/build.py, which stages
# the Markdown sources into _build/docs first.
site_name: The Lab Manual
# Used as the meta description, which search results often show as the snippet.
site_description: A living, community-editable guide to help bioengineers and new scientists get started in the wet lab.
docs_dir: ../../_build/docs
site_dir: ../../_site
use_directory_urls: true

# No edit_uri and no content.action.edit feature: pages have no "Edit this
# page" button. Changes go through GitHub Issues and pull requests.
repo_url: https://github.com/samholtzen/labmanual
repo_name: samholtzen/labmanual
hooks:
  - hooks.py

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Helvetica Neue


# Add a page: create the Markdown file, then add one line here.
# Each unit is a group whose first entry is its index.md (the unit
# introduction); the entries after it are the unit's chapters, in reading order.
nav:
  - Home: index.md
  - Units:
      - Molecular Cloning:
          - units/cloning/index.md
          - Plasmids and Vectors: units/cloning/plasmids-and-vectors.md
          - Restriction/Ligation Cloning: units/cloning/restriction-ligation.md
          - Golden Gate Assembly: units/cloning/golden-gate.md
          - PCR: units/cloning/pcr.md
      - Bacterial Cell Culture:
          - units/bacteria/index.md
          - Culturing E. coli: units/bacteria/culture.md
          - Strain Selection: units/bacteria/strain-selection.md
          - Genetic Manipulation: units/bacteria/genetic-manipulation.md
      - Mammalian Cell Culture:
          - units/mammalian-cells/index.md
          - Growing Cells: units/mammalian-cells/growing.md
          - Maintaining Cells: units/mammalian-cells/maintaining.md
          - Storing Cells: units/mammalian-cells/storing.md
      - Foundations:
          - units/foundations/index.md
          - Aseptic Technique: units/foundations/aseptic-technique.md
  - Protocols:
      - PCR: protocols/pcr.md
      - Restriction Digest: protocols/restriction_digest.md
      - T4 Ligation: protocols/t4_ligase.md
      - Golden Gate Assembly: protocols/golden_gate.md
      - Chemical Transformation of E. coli: protocols/chemical_transformation_of_e_coli.md
  - Glossary: units/glossary.md

markdown_extensions:
  - tables
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css
